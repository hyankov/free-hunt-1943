name: Idea
description: Suggest a feature or a change.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see, and why would it make the game more fun?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: What do you play on?
      options:
        - R36S / PortMaster handheld
        - Android
        - Both
